name: Build (Windows/MSBuild)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v1

      - name: Restore NuGet packages
        run: nuget restore ModelForge.Excel.sln

      - name: Build solution with MSBuild
        run: msbuild ModelForge.Excel.sln /t:Rebuild /p:Configuration=Debug /p:Platform="Any CPU" /v:minimal

      - name: List build artifacts
        run: |
          if (Test-Path .\src\vsto\ModelForge.Excel\bin\Debug) { Get-ChildItem -Recurse .\src\vsto\ModelForge.Excel\bin\Debug | Select-Object FullName,Length } else { Write-Host 'No artifacts found in expected path.' }
