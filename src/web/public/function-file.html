<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ModelForge Function File</title>
  <script src="https://appsforoffice.microsoft.com/lib/1.1/hosted/office.js"></script>
  <script>
    Office.onReady(() => {
      // Register all ExecuteFunction handlers
      Office.actions.associate('onExecute', executeCommand);
    });

    /**
     * Execute a ModelForge command via the Sidecar REST API.
     * @param {Office.AddinCommands.Event} event
     */
    async function executeCommand(event) {
      const commandId = event?.source?.id;
      if (!commandId) {
        console.error('ModelForge: No command ID in event');
        event.completed({ allowEvent: false, errorMessage: 'Missing command ID' });
        return;
      }

      try {
        const response = await fetch('http://localhost:5200/api/execute', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            commandId: commandId,
            host: 'excel',
          }),
        });

        if (response.ok) {
          const result = await response.json();
          console.log('ModelForge: Command executed', result);
          event.completed({ allowEvent: true });
        } else {
          const error = await response.text();
          console.error('ModelForge: Command failed', error);
          event.completed({ allowEvent: false, errorMessage: error });
        }
      } catch (err) {
        console.error('ModelForge: Sidecar unreachable', err);
        event.completed({
          allowEvent: false,
          errorMessage: 'Sidecar service is not running. Please start ModelForge Sidecar.',
        });
      }
    }
  </script>
</head>
<body>
  <p>ModelForge Function File — loaded by Office.js for ribbon command execution.</p>
</body>
</html>
