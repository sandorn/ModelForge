<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>ModelForge Function File</title>
  <script src="https://appsforoffice.microsoft.com/lib/1.1/hosted/office.js"></script>
</head>
<body>
  <script>
    Office.onReady(() => {
      console.log("ModelForge function-file ready");
    });

    /**
     * onExecute handler — called by Ribbon buttons.
     * Reads the button id (commandId) and forwards to Sidecar REST API.
     */
    async function onExecute(event) {
      const commandId = event?.source?.id;
      if (!commandId) {
        event.completed({ allowEvent: false });
        return;
      }

      try {
        // Determine host from command ID prefix
        let host = "excel";
        if (commandId.startsWith("ppt.")) host = "powerpoint";
        else if (commandId.startsWith("word.")) host = "word";

        const response = await fetch("http://localhost:5200/api/execute", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "X-Trace-Id": crypto.randomUUID(),
          },
          body: JSON.stringify({ commandId, host }),
        });

        if (response.ok) {
          const data = await response.json();
          console.log("Command executed:", commandId, data);
        } else {
          console.error("Command failed:", commandId, response.status);
        }
      } catch (err) {
        console.error("Command execution error:", err);
      }

      event.completed();
    }

    // Register the function with Office
    Office.actions.associate("onExecute", onExecute);
  </script>
</body>
</html>
