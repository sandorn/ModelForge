name: ModelForge CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  backend:
    name: Backend build and smoke test
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build backend
        run: dotnet build src\backend\ModelForge.Backend\ModelForge.Backend.csproj --configuration Release

      - name: Run backend smoke tests
        run: dotnet run --project tests\backend\ModelForge.Backend.SmokeTests\ModelForge.Backend.SmokeTests.csproj --configuration Release

  sidecar:
    name: Sidecar build
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build sidecar
        run: dotnet build src\sidecar\ModelForge.Sidecar\ModelForge.Sidecar.csproj --configuration Release

      - name: Run sidecar tests
        run: dotnet test tests\sidecar\ModelForge.Sidecar.Tests\ModelForge.Sidecar.Tests.csproj --configuration Release --verbosity minimal

  web:
    name: Web Add-in build
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: src/web
        run: npm install

      - name: Build Web Add-in
        working-directory: src/web
        run: npm run build
